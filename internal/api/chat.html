<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话 · Clash of Tokens</title>
<style>:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#18354d;background:#edf3f8}*{box-sizing:border-box}body{margin:0}header{padding:20px 30px;background:#18354d;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}header a{color:#c7e2f8}h1{font-size:21px;margin:0}main{max-width:920px;margin:auto;padding:24px}.connection{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-size:13px;display:grid;gap:6px}input,select,textarea,button{font:inherit;border:1px solid #7890a4;border-radius:6px;padding:10px 12px;background:#fff;color:#18354d}button{cursor:pointer;background:#235d89;color:white;border-color:#235d89}button.secondary{background:white;color:#235d89}button:disabled{opacity:.5;cursor:default}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #be6500;outline-offset:2px}#thread{min-height:220px;padding:22px 0}.empty{margin:38px 0;color:#50667c;line-height:1.8}.turn{margin:0 0 22px;max-width:95%}.turn.user{margin-left:auto;max-width:80%}.speaker{font-size:12px;color:#50667c;margin-bottom:7px}.content{background:white;padding:18px 22px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.user .content{background:#d9e8f4}textarea{width:100%;min-height:100px;resize:vertical;line-height:1.6}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}#status{min-height:24px;color:#954800;font-size:13px;line-height:1.6}.hint{font-size:12px;color:#50667c}footer{margin-top:24px;border-top:1px solid #cbd9e5;padding-top:16px;color:#50667c;font-size:12px;line-height:1.8}@media(max-width:600px){main{padding:16px}header{padding:18px}h1{font-size:17px}.connection label,.connection input,.connection select{width:100%}.turn.user{max-width:90%}.content{padding:14px}}</style>
<header><h1>Clash of Tokens · 对话</h1><a href="/">来源管理</a></header><main>
<div class="connection"><label>API 密钥<input id="key" type="password" autocomplete="off" placeholder="输入 API 密钥"></label><button id="connect">连接</button><label>对话来源<select id="model"><option>连接后选择来源</option></select></label><button class="secondary" id="new">新对话</button></div>
<p class="hint">密钥与本页对话只留在页面内存。ChatGPT 网页来源仍会在你的 ChatGPT 账号中保存对话。</p><div id="status" role="status" aria-live="polite">先连接网关，再开始对话。</div>
<div id="thread" aria-live="polite"><div class="empty">向一个已启用的来源发送消息。<br>ChatGPT 网页对话会绑定同一账号与上游会话，后续消息继续原来的上下文。</div></div>
<form id="composer"><label for="prompt">消息</label><textarea id="prompt" placeholder="输入消息，Ctrl + Enter 发送" required></textarea><div class="actions"><button type="button" class="secondary" id="stop" disabled>停止</button><button id="send" disabled>发送</button></div></form>
<footer>网页对话当前支持纯文本。系统角色、原生工具调用、图片和无法保真的参数会明确报错。取消只代表本地停止等待，上游停止状态可能未知。</footer>
</main><script>
const el=id=>document.getElementById(id);let key='',messages=[],session='',controller=null,locked=false;
function state(busy){el('send').disabled=busy||!key||locked;el('stop').disabled=!busy;el('new').disabled=busy;el('model').disabled=busy||messages.length>0;el('connect').disabled=busy;el('prompt').disabled=busy}
function turn(role,text){if(!messages.length&&role==='user')el('thread').replaceChildren();const box=document.createElement('div');box.className='turn '+role;const label=document.createElement('div');label.className='speaker';label.textContent=role==='user'?'你':'来源回复';const content=document.createElement('div');content.className='content';content.textContent=text;box.append(label,content);el('thread').append(box);return content;}
el('connect').onclick=async()=>{try{const candidate=el('key').value||key;const res=await fetch('/v1/models',{headers:{Authorization:'Bearer '+candidate}});const data=await res.json();if(!res.ok)throw Error(data.error?.message||'连接失败');key=candidate;el('key').value='';el('model').replaceChildren();const models=data.data.filter(m=>m.owned_by!=='clash-tokens');for(const m of models){const option=document.createElement('option');option.value=m.id;option.textContent=m.id;el('model').append(option)}if(!models.length)throw Error('没有已启用的模型，请先配置并启用来源。');el('status').textContent='已连接';state(false)}catch(e){el('status').textContent=e.message}};
el('new').onclick=()=>{messages=[];session='';locked=false;el('thread').replaceChildren();el('status').textContent='下一条消息会开始独立的新对话。';state(false)};
el('stop').onclick=()=>controller?.abort();el('prompt').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'&&!el('send').disabled){e.preventDefault();el('composer').requestSubmit()}};
el('composer').onsubmit=async e=>{e.preventDefault();if(controller||locked||!key)return;const prompt=el('prompt').value;if(!prompt.trim())return;turn('user',prompt);const output=turn('assistant','等待回复…');const pending=[...messages,{role:'user',content:prompt}];controller=new AbortController();state(true);el('status').textContent='正在等待来源回复…';let answer='',done=false;
try{const headers={Authorization:'Bearer '+key,'Content-Type':'application/json'};if(session)headers['X-COT-Session']=session;const res=await fetch('/v1/chat/completions',{method:'POST',headers,body:JSON.stringify({model:el('model').value,messages:pending,stream:true}),signal:controller.signal});if(!res.ok){const data=await res.json();throw Error(data.error?.message||'请求失败')};session=res.headers.get('X-COT-Session')||session;
const reader=res.body.getReader(),decoder=new TextDecoder();let buffer='';for(;;){const result=await reader.read();buffer+=decoder.decode(result.value||new Uint8Array(),{stream:!result.done});let match;while((match=/\r?\n\r?\n/.exec(buffer))){const frame=buffer.slice(0,match.index);buffer=buffer.slice(match.index+match[0].length);const data=frame.split(/\r?\n/).filter(l=>l.startsWith('data:')).map(l=>l.slice(5).replace(/^ /,'')).join('\n');if(!data)continue;if(data==='[DONE]'){done=true;continue};const chunk=JSON.parse(data);if(chunk.error)throw Error(chunk.error.message||'上游流错误');const delta=chunk.choices?.[0]?.delta?.content;if(typeof delta==='string'){answer+=delta;output.textContent=answer;el('status').textContent='正在接收回复…'}}if(result.done)break;}if(!done)throw Error('连接在完成标记之前结束，请检查上游对话后开始新会话。');messages=[...pending,{role:'assistant',content:answer}];el('prompt').value='';el('status').textContent='已完成'+(session?' · 会话已绑定':'');
}catch(error){locked=true;el('status').textContent=error.name==='AbortError'?'已停止等待。为避免重复提交，请开始新对话。':error.message;if(!answer)output.textContent='本轮未完成。';}finally{controller=null;state(false)}};
</script></html>
