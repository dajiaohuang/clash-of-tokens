<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clash of Tokens</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#18354d;background:#edf3f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#18354d;color:white;padding:30px max(24px,calc((100vw - 1160px)/2));display:flex;align-items:center;gap:20px}h1{font-size:26px;letter-spacing:-.8px;margin:0}header p{margin:6px 0 0;color:#bdcfdf}.mark{width:48px;height:48px;border:3px solid #99c3e7;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700}main{max-width:1160px;margin:30px auto;padding:0 24px}section{margin-bottom:28px}.access{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px;font-size:14px}input,select,button{font:inherit;border:1px solid #7890a4;border-radius:5px;padding:10px 13px;background:white;color:#18354d}input{min-width:240px}button{cursor:pointer;background:#235d89;color:white;border-color:#235d89}button:disabled{opacity:.6;cursor:wait}button.secondary{background:white;color:#235d89}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #be6500;outline-offset:3px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;padding:22px;gap:20px;border-radius:8px}.metrics strong{display:block;font-size:28px;margin-top:8px;font-weight:600}.metrics span{font-size:14px;color:#50667c}.tablewrap{overflow:auto;background:#fff;border-radius:8px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:13px;color:#50667c;font-weight:500;padding:14px 18px;background:#e3edf6}td{padding:16px 18px;border-bottom:1px solid #e3edf6}td button{padding:5px 12px;font-size:13px}h2{font-size:19px;font-weight:600;margin-bottom:14px}.badge{display:inline-block;padding:4px 9px;border-radius:12px;background:#e3edf6;font-size:12px}.on{background:#deeee8;color:#176549}.blocked{background:#fbe8db;color:#954800}.empty{padding:38px;white-space:normal;text-align:center;color:#50667c}#message{min-height:26px;margin-top:15px;color:#954800}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px;line-height:1.7;font-size:13px}.muted{color:#50667c;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}footer{border-top:1px solid #cbd9e5;padding:20px 0;color:#50667c;font-size:13px}@media(max-width:680px){.metrics{grid-template-columns:1fr 1fr}header{padding:22px}h1{font-size:22px}main{padding:0 16px}.access label,.access input{width:100%}.access{align-items:stretch}.row{align-items:start}th,td{padding:12px}}
</style>
<header><div class="mark" aria-hidden="true">≋</div><div><h1>Clash of Tokens</h1><p>Many AI sources. One API.</p></div><a href="/chat" style="color:#c7e2f8;margin-left:auto">开始对话</a></header>
<main><section><div class="access"><label>管理密钥<input id="key" type="password" autocomplete="off" placeholder="输入 COT_ADMIN_KEY"></label><button id="connect">连接并刷新</button><button class="secondary" id="disconnect">清除密钥</button></div><p class="muted">密钥仅保留在当前页面内存中。关闭页面即清除。</p><div id="message" role="status" aria-live="polite">连接后查看来源状态。</div></section>
<section class="metrics" aria-label="网关指标"><div><span>已配置来源</span><strong id="sources">—</strong></div><div><span>在途请求</span><strong id="active">—</strong></div><div><span>累计请求 / 拒绝</span><strong id="requests">—</strong></div><div><span>请求缓冲预算占用</span><strong id="memory">—</strong></div></section>
<section><div class="row"><h2>来源池</h2><p class="muted">开关立即影响新调度；重启恢复配置文件。</p></div><div class="tablewrap"><table><thead><tr><th>来源</th><th>状态</th><th>在途</th><th>成功 / 失败</th><th>平均耗时</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">尚未连接。输入管理密钥读取来源池。</td></tr></tbody></table></div></section>
<section><h2>路由解释</h2><div class="access"><label>模型或策略组<input id="model" value="auto/silver"></label><label>请求协议<select id="protocol"><option value="responses">Responses</option><option value="chat">Chat Completions</option><option value="messages">Anthropic Messages</option><option value="gemini">Gemini</option></select></label><button class="secondary" id="explain">检查候选来源</button></div><pre id="reasons">选择协议和模型后检查来源是否符合条件。</pre></section>
<footer>账号额度未知时保持未知。此面板不会发送探测或推理请求。</footer></main>
<script>
const el=id=>document.getElementById(id);let token='';
async function api(path,options={}){if(!token)throw Error('请先输入管理密钥并连接。');const res=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error?.message||'请求失败');return data;}
async function refresh(){try{const d=await api('/admin/status');el('sources').textContent=d.sources.length;el('active').textContent=d.sources.reduce((n,s)=>n+s.active,0);el('requests').textContent=d.requests+' / '+d.rejected;el('memory').textContent=(d.buffered_bytes/1048576).toFixed(1)+' MiB';el('rows').replaceChildren();for(const s of d.sources){const tr=document.createElement('tr');const cooling=Date.parse(s.cooldown)>Date.now();const values=[s.id,s.blocked?'需要重新认证':!s.enabled?'已禁用':cooling?'冷却中':'已启用',s.active,s.completed+' / '+s.failures,s.latency_ms?Math.round(s.latency_ms)+' ms':'—'];values.forEach((v,i)=>{const td=document.createElement('td');if(i===1){const badge=document.createElement('span');badge.className='badge '+(s.blocked?'blocked':s.enabled?'on':'');badge.textContent=v;td.append(badge)}else td.textContent=v;tr.append(td)});const td=document.createElement('td'),b=document.createElement('button');b.textContent=s.enabled?'禁用':'启用';b.onclick=async()=>{b.disabled=true;try{await api('/admin/sources/'+encodeURIComponent(s.id),{method:'POST',body:JSON.stringify({enabled:!s.enabled})});await refresh()}catch(e){el('message').textContent=e.message}finally{b.disabled=false}};td.append(b);tr.append(td);el('rows').append(tr)}if(!d.sources.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='来源池为空。请在配置文件中添加来源、模型和凭证环境变量，然后重启网关。';tr.append(td);el('rows').append(tr)}el('message').textContent='已更新 · '+new Date().toLocaleTimeString()}catch(e){el('message').textContent=e.message}}
el('connect').onclick=()=>{token=el('key').value;el('key').value='';refresh()};el('disconnect').onclick=()=>{token='';el('key').value='';el('message').textContent='管理密钥已清除。'};el('explain').onclick=async()=>{try{const data=await api('/admin/explain?model='+encodeURIComponent(el('model').value)+'&protocol='+encodeURIComponent(el('protocol').value));el('reasons').textContent=Object.entries(data).map(([k,v])=>k+'  →  '+v).join('\n')||'没有已配置的模型。'}catch(e){el('message').textContent=e.message}};
</script></html>
